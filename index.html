<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Python / Jupyter のコードを、行ごと・関数ごとの解説つきで読むアプリ">
<meta name="theme-color" content="#050608" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>code helper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;600;700&family=Space+Grotesk:wght@500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
/* Layout: floating glass toolbar over a dotted work surface; file title block; overview card (2 cols on desktop); notebook cells as cards with a tinted code well; tapped line opens an annotation tray (role | process / grammar / my note); name taps open a drawer (right on desktop, bottom on phone). */
:root{
  --bg:#eef1f4; --dots:rgba(22,40,60,.07); --surface:#ffffff; --surface-2:#f5f7f9; --code-bg:#fafbfc;
  --ink:#15202b; --muted:#5b6979; --faint:#8b97a4; --line:#e0e5eb;
  --accent:#0b7f86; --accent-2:#e3f3f3; --accent-ink:#ffffff; --hl:#e8f5f5;
  --memo:#b85f08; --memo-bg:#fff4e6; --memo-edge:#f1c48d;
  --kw:#8b3fd9; --str:#18794e; --num:#c2410c; --com:#8b97a4; --call:#0b6bcb; --def:#c0265b; --bi:#0b7f86;
  --danger:#b42318;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 22px -10px rgba(16,24,40,.16);
  --f-brand:"Space Grotesk","IBM Plex Sans JP",system-ui,sans-serif;
  --f-body:"IBM Plex Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --f-code:"JetBrains Mono","Consolas","Menlo",ui-monospace,monospace;
  --code-size:13.5px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#050608; --dots:rgba(255,255,255,.05); --surface:#0c0f13; --surface-2:#13171d; --code-bg:#080a0d;
  --ink:#e8edf2; --muted:#98a3af; --faint:#5f6a76; --line:#1b2128;
  --accent:#4fd1c5; --accent-2:rgba(79,209,197,.13); --accent-ink:#062a28; --hl:rgba(79,209,197,.08);
  --memo:#f6ad55; --memo-bg:rgba(246,173,85,.10); --memo-edge:rgba(246,173,85,.38);
  --kw:#c4a1ff; --str:#7ee2a8; --num:#ffa36b; --com:#6b7785; --call:#79b8ff; --def:#ff7eb6; --bi:#4fd1c5;
  --danger:#ff8a80; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px -12px rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#050608; --dots:rgba(255,255,255,.05); --surface:#0c0f13; --surface-2:#13171d; --code-bg:#080a0d;
  --ink:#e8edf2; --muted:#98a3af; --faint:#5f6a76; --line:#1b2128;
  --accent:#4fd1c5; --accent-2:rgba(79,209,197,.13); --accent-ink:#062a28; --hl:rgba(79,209,197,.08);
  --memo:#f6ad55; --memo-bg:rgba(246,173,85,.10); --memo-edge:rgba(246,173,85,.38);
  --kw:#c4a1ff; --str:#7ee2a8; --num:#ffa36b; --com:#6b7785; --call:#79b8ff; --def:#ff7eb6; --bi:#4fd1c5;
  --danger:#ff8a80; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px -12px rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;background-image:radial-gradient(var(--dots) 1px,transparent 1.2px);background-size:18px 18px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:17px;height:17px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* toolbar */
.bar{transition:transform .25s ease,opacity .2s ease;will-change:transform}
.bar.hide{transform:translateY(calc(-100% - 16px));opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){.bar{transition:none}}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding-block:10px 0;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.bar-in{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-radius:16px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 84%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto;min-width:0}
.mark{width:34px;height:34px;flex:0 0 auto;display:block;border-radius:10px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.25))}
.word{font-family:var(--f-brand);font-weight:600;font-size:18px;letter-spacing:-.02em;white-space:nowrap}
.word b{color:var(--accent);font-weight:600}
.tools{display:flex;align-items:center;gap:4px;min-width:0}
.sep{width:1px;height:20px;background:var(--line);margin:0 4px;flex:0 0 auto}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:10px;border:1px solid transparent;background:transparent;font-size:13.5px;cursor:pointer;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--surface-2);border-color:var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,var(--ink));border-color:transparent}
.btn.ghost{border-color:var(--line);background:var(--surface)}
.btn.ic{width:34px;padding:0;justify-content:center;font-family:var(--f-code);font-size:12.5px}
.btn[aria-pressed="true"]{background:var(--accent-2);color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:default;background:transparent;border-color:transparent}
@media (max-width:680px){
  .bar-in{flex-wrap:wrap;padding:8px}
  .tools{width:100%;overflow-x:auto;scrollbar-width:none}
  .tools::-webkit-scrollbar{display:none}
  .tools .lbl{display:none}
  .tools .btn:not(.ic){padding:0 10px}
  .tools .btn.primary .lbl{display:inline}
  .tools{gap:2px}
  .tools>*{flex:none}
  .tools .sep{display:none}
  .tools .btn.ic{width:27px}
  .tools .btn.primary{padding:0 9px}
  .tools .btn:not(.ic):not(.primary){padding:0 7px}
}
.progress{max-width:1000px;margin:8px auto 0;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);padding:6px 12px;border-radius:12px;background:color-mix(in srgb,var(--surface) 90%,transparent);border:1px solid var(--line)}
.progress .track{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.progress .fill{height:100%;background:var(--accent);width:0;transition:width .3s}

/* page */
main{max-width:1000px;margin:0 auto;padding-block:26px 140px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.filehead{display:flex;flex-direction:column;gap:8px;min-width:0}
.eyebrow{font-family:var(--f-code);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600}
.filehead h1{margin:0;font-family:var(--f-brand);font-weight:600;font-size:clamp(22px,4vw,30px);letter-spacing:-.02em;line-height:1.2;word-break:break-all;text-wrap:balance}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.stat{font-family:var(--f-code);font-size:12px;padding:3px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.stat b{color:var(--ink);font-weight:600}
.stat.memo b{color:var(--memo)}
.notice{font-size:13px;color:var(--muted);max-width:75ch}
.notice strong{color:var(--ink);font-weight:600}

.overview{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 22px;box-shadow:var(--shadow);display:grid;gap:18px 32px}
@media (min-width:760px){.overview.full{grid-template-columns:1.25fr 1fr}}
.overview .col{display:flex;flex-direction:column;gap:10px;min-width:0}
.overview h2{margin:0;font-family:var(--f-brand);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.overview .purpose{margin:0;font-size:16px;line-height:1.75;max-width:62ch}
.flow{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:f}
.flow li{counter-increment:f;display:grid;grid-template-columns:26px 1fr;gap:10px;font-size:14px}
.flow li::before{content:counter(f);font-family:var(--f-code);font-size:11.5px;font-weight:600;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--accent-2);color:var(--accent);margin-top:2px}
.terms{display:flex;flex-direction:column;gap:8px;margin:0}
.terms div{display:grid;grid-template-columns:minmax(80px,auto) 1fr;gap:10px;align-items:baseline;min-width:0;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.terms div:last-child{border-bottom:none;padding-bottom:0}
.terms dt{font-family:var(--f-code);font-size:12.5px;font-weight:600;color:var(--def);word-break:break-all}
.terms dd{margin:0;font-size:13.5px;color:var(--muted)}
.sub{font-family:var(--f-code);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend kbd{font-family:var(--f-code);font-size:11.5px;padding:1px 7px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}

.md{padding:0 4px;max-width:72ch;min-width:0}
.md h1,.md h2,.md h3{font-family:var(--f-brand);letter-spacing:-.015em;line-height:1.3;text-wrap:balance;margin:.5em 0 .3em}
.md h1{font-size:22px}.md h2{font-size:18px}.md h3{font-size:16px}
.md p{margin:.4em 0}
.md code{font-family:var(--f-code);font-size:.88em;background:var(--surface);border:1px solid var(--line);padding:1px 5px;border-radius:5px}
.md pre{overflow-x:auto;background:var(--surface);border:1px solid var(--line);padding:10px;border-radius:10px}
.md img{max-width:100%}

/* cells */
.cell{background:var(--surface);border:1px solid var(--line);border-radius:18px;min-width:0;overflow:hidden;box-shadow:var(--shadow)}
.cell-h{display:flex;flex-direction:column;gap:8px;padding:12px 16px}
.cell-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.cell-no{font-family:var(--f-code);font-size:11.5px;font-weight:600;color:var(--accent);background:var(--accent-2);padding:2px 9px;border-radius:7px;font-variant-numeric:tabular-nums}
.cell-meta{font-family:var(--f-code);font-size:11.5px;color:var(--faint)}
.cell-acts{margin-left:auto;display:flex;gap:4px}
.cell-acts .btn{height:28px;font-size:12.5px;padding:0 10px}
.cell-sum{margin:0;font-size:14px;color:var(--ink);max-width:75ch}
.cell-sum:empty,.cell-memo:empty{display:none}

.code{overflow-x:auto;font-family:var(--f-code);font-size:var(--code-size);line-height:1.65;padding-block:8px;background:var(--code-bg);border-top:1px solid var(--line)}
.rows{min-width:100%;width:max-content}
.code.wrap .rows{width:auto}
.row{display:flex;align-items:flex-start}
.row:hover{background:color-mix(in srgb,var(--surface-2) 70%,transparent)}
.row.on{background:var(--hl)}
.lno{position:sticky;left:0;flex:0 0 auto;width:4.2em;display:flex;align-items:center;justify-content:flex-end;gap:4px;padding:0 .8em 0 0;border:none;background:var(--code-bg);color:var(--faint);font:inherit;font-size:.84em;line-height:1.96;cursor:pointer;margin-right:.6em;user-select:none;font-variant-numeric:tabular-nums}
.row:hover .lno{background:color-mix(in srgb,var(--surface-2) 70%,var(--code-bg))}
.row.on .lno{background:var(--hl);color:var(--accent);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.lno:hover{color:var(--accent)}
.lno .dot,.lno .mm{width:5px;height:5px;border-radius:50%;flex:0 0 auto}
.lno .mm{display:none;background:var(--memo);border-radius:2px;width:6px;height:6px}
.lno.has .dot{background:color-mix(in srgb,var(--accent) 55%,transparent)}
.lno.memo .mm{display:block}
.src{white-space:pre;padding-right:18px;min-height:1.65em;flex:1 1 auto}
.code.wrap .src{white-space:pre-wrap;word-break:break-all;min-width:0}
.t-kw{color:var(--kw);font-weight:600}.t-str{color:var(--str)}.t-num{color:var(--num)}.t-com{color:var(--com);font-style:italic}
.t-call{color:var(--call)}.t-def{color:var(--def);font-weight:600}.t-bi{color:var(--bi)}.t-mod{color:var(--bi)}
.tap{cursor:pointer;border-radius:4px;text-decoration:underline;text-decoration-color:color-mix(in srgb,currentColor 30%,transparent);text-underline-offset:3px;text-decoration-thickness:1px}
.tap:hover,.tap:focus-visible{background:color-mix(in srgb,currentColor 12%,transparent);text-decoration-color:currentColor}

.note-row{position:sticky;left:0;display:flex;gap:8px;align-items:flex-start;margin:2px 14px 6px calc(4.8em);padding:6px 10px;border-radius:10px;background:var(--memo-bg);border:1px solid var(--memo-edge);color:var(--ink);font-family:var(--f-body);font-size:13px;line-height:1.6;cursor:pointer;white-space:pre-wrap;word-break:break-word}
.note-row svg{color:var(--memo);margin-top:2px;width:14px;height:14px}

/* annotation tray */
.xp{position:sticky;left:0;font-family:var(--f-body);font-size:14px;line-height:1.7;background:var(--hl);border-bottom:1px solid var(--line);padding:4px 16px 14px calc(4.8em);display:flex;flex-direction:column;gap:10px;white-space:normal}
@media (max-width:560px){.xp{padding-left:12px;padding-right:12px}.note-row{margin-left:12px;margin-right:12px}}
.xp-grid{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:700px){.xp-grid{grid-template-columns:1fr 1fr}}
.xc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:0}
.xc.wide{grid-column:1/-1}
.xc.gram{background:color-mix(in srgb,var(--kw) 6%,var(--surface));border-color:color-mix(in srgb,var(--kw) 22%,var(--line))}
.xc.mine{background:var(--memo-bg);border-color:var(--memo-edge)}
.xc .k{display:flex;align-items:center;gap:6px;font-family:var(--f-code);font-size:10.5px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-weight:600;margin-bottom:2px}
.xc.gram .k{color:var(--kw)}
.xc.mine .k{color:var(--memo)}
.xc p{margin:0;max-width:65ch}
.xc .mtext{white-space:pre-wrap;word-break:break-word}
.xp code,.sheet code,.overview code,.cell-sum code,.xc code{font-family:var(--f-code);font-size:.88em;background:var(--surface-2);border:1px solid var(--line);padding:0 5px;border-radius:5px}
.xp-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:11px;background:var(--surface);padding:2px}
.seg .btn{height:30px;font-size:13px;padding:0 12px;border-radius:9px}
.err{color:var(--danger)}
.thinking{color:var(--muted);display:flex;align-items:center;gap:8px}
.thinking::before{content:"";width:13px;height:13px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.thinking::before{animation:none}.progress .fill{transition:none}}

/* memo editor */
.medit{display:flex;flex-direction:column;gap:8px}
.medit textarea{width:100%;min-height:84px;border:1px solid var(--memo-edge);border-radius:10px;padding:8px 10px;background:var(--surface);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;resize:vertical}
.medit .row-btns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.medit .hint{font-size:12px;color:var(--faint);margin-left:auto}
.addmemo{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--memo-edge);background:transparent;color:var(--memo);border-radius:10px;height:32px;padding:0 12px;font-size:13px;cursor:pointer}
.addmemo:hover{background:var(--memo-bg)}
.cmemo{background:var(--memo-bg);border:1px solid var(--memo-edge);border-radius:12px;padding:8px 12px;font-size:13.5px;white-space:pre-wrap;word-break:break-word;cursor:pointer}
.cmemo .k{font-family:var(--f-code);font-size:10.5px;letter-spacing:.14em;color:var(--memo);font-weight:600;display:block}

.outs{border-top:1px solid var(--line);padding:10px 16px 12px;display:flex;flex-direction:column;gap:6px}
.outs pre{margin:0;font-family:var(--f-code);font-size:12.5px;white-space:pre-wrap;word-break:break-all;max-height:260px;overflow:auto;color:var(--muted)}
.outs pre.err{color:var(--danger)}
.outs img{max-width:100%;height:auto;background:#fff;border-radius:8px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(8,12,18,.42);z-index:40;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;margin:0 auto;max-width:680px;max-height:80vh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;border:1px solid var(--line);border-bottom:none;padding:12px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;box-shadow:0 -12px 40px rgba(0,0,0,.22)}
.sheet .grab{width:42px;height:4px;border-radius:2px;background:var(--line);align-self:center}
@media (min-width:900px){
  .sheet{left:auto;right:max(14px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 14px);bottom:14px;width:430px;max-height:none;margin:0;border-radius:20px;border-bottom:1px solid var(--line);padding:20px 22px}
  .sheet .grab{display:none}
}
.sheet-h{display:flex;align-items:flex-start;gap:10px}
.sheet-h h3{margin:0;font-family:var(--f-code);font-size:18px;font-weight:600;word-break:break-all;flex:1;min-width:0;line-height:1.35}
.chip{font-family:var(--f-code);font-size:11px;border-radius:99px;padding:2px 10px;color:var(--accent);background:var(--accent-2);white-space:nowrap;margin-top:3px}
.sig{font-family:var(--f-code);font-size:13px;background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto;white-space:pre}
.sheet p{margin:0;max-width:65ch}
.sheet .k{font-family:var(--f-code);font-size:10.5px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.args{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.args li{display:grid;grid-template-columns:minmax(60px,auto) 1fr;gap:10px;font-size:14px}
.args b{font-family:var(--f-code);font-weight:600;font-size:12.5px;color:var(--def)}
.ai-box{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.close{border:none;background:var(--surface-2);width:30px;height:30px;border-radius:9px;display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:0 0 auto}
.close:hover{color:var(--ink)}
.paste{display:flex;flex-direction:column;gap:10px}
.scrim.top{z-index:50}
.ai-stat{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;max-width:calc(100% - 32px);background:var(--surface);color:var(--ink);border:1px solid var(--accent);border-radius:99px;padding:8px 16px;font-size:13px;box-shadow:var(--shadow);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}.sheet.top{z-index:51}
.paste textarea.short{min-height:18vh}
.seg-eng{display:flex;flex-direction:column;gap:8px}
.eng{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.eng:has(input:checked){border-color:var(--accent);background:var(--accent-2)}
.eng input{margin-top:5px;accent-color:var(--accent);flex:none}
.eng b{display:block;font-size:14px}
.eng small,.fld small,.steps small{color:var(--muted);font-size:12.5px;line-height:1.55;display:block}
.fld{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.fld input{height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--code-bg);color:var(--ink);font-family:var(--f-code);font-size:14px;width:100%}
.fld a,.steps a{color:var(--accent)}
.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:14px}
.steps li{display:flex;flex-direction:column;gap:8px}
.steps li::marker{font-family:var(--f-code);color:var(--accent);font-weight:600}
.steps details summary{font-size:13px;color:var(--muted);cursor:pointer}
.paste textarea{width:100%;min-height:42vh;font-family:var(--f-code);font-size:13px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--code-bg);color:var(--ink);resize:vertical}
</style>
</head>

/* ───────── Tokenizer ───────── */
const RE = /([rRbBuUfF]{0,2})("""[\s\S]*?(?:"""|$)|'''[\s\S]*?(?:'''|$)|"(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?)|(#[^\n]*)|(0[xXoObB][\da-fA-F_]+|\d[\d_]*\.?[\d_]*(?:[eE][+-]?\d+)?j?|\.\d+(?:[eE][+-]?\d+)?j?)|([A-Za-z_\u00C0-\uFFFF][\w\u00C0-\uFFFF]*)|(\r?\n)|([ \t\f]+)|(\*\*=?|\/\/=?|->|:=|==|!=|<=|>=|<<=?|>>=?|[-+*\/%@&|^]=|[-+*\/%@<>=!&|^~:.,;()\[\]{}\\])|([\s\S])/gy;
function tokenize(src){
  const out = []; RE.lastIndex = 0; let m;
  while (RE.lastIndex < src.length && (m = RE.exec(src))) {
    if (m[2] !== undefined) out.push({t:"str", v:m[1] + m[2], pre:m[1].toLowerCase()});
    else if (m[3] !== undefined) out.push({t:"com", v:m[3]});
    else if (m[4] !== undefined) out.push({t:"num", v:m[4]});
    else if (m[5] !== undefined) out.push({t:"name", v:m[5]});
    else if (m[6] !== undefined) out.push({t:"nl", v:"\n"});
    else if (m[7] !== undefined) out.push({t:"ws", v:m[7]});
    else out.push({t:"op", v:m[8] ?? m[9]});
  }
  return out;
}

let noThink = true;   // ask for a quick answer without long "thinking"; turned off if the model refuses the setting
const IDLE_MS = 60000, TOTAL_MS = 240000;
async function geminiOnce(model, prompt, signal){
  const ctl = new AbortController();
  const onAbort = () => ctl.abort();
  signal?.addEventListener("abort", onAbort, {once:true});
  const t0 = Date.now(); let got = 0, why = null, idle = null;
  const kick = () => { clearTimeout(idle); idle = setTimeout(() => { why = "slow"; ctl.abort(); }, IDLE_MS); };
  const tick = setInterval(() => {
    const sec = Math.round((Date.now() - t0) / 1000);
    aiStat(got ? `Gemini から受信中… ${got.toLocaleString()}文字（${sec}秒）` : `Gemini の応答を待っています… ${sec}秒`);
    if (Date.now() - t0 > TOTAL_MS) { why = "slow"; ctl.abort(); }
  }, 1000);
  const label = model === LITE ? "（軽いモデル）" : "";
  aiStat(`Gemini${label} に送信しました…`);
  const gen = {responseMimeType:"application/json", temperature:0.3, maxOutputTokens:16384};
  if (noThink) gen.thinkingConfig = {thinkingBudget:0};
  try {
    kick();
    let res;
    try {
      res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:streamGenerateContent?alt=sse`, {
        method:"POST", signal:ctl.signal,
        headers:{"Content-Type":"application/json", "x-goog-api-key":gem.key},
        body:JSON.stringify({contents:[{role:"user", parts:[{text:prompt}]}], generationConfig:gen}),
      });
    } catch (e) {
      if (why === "slow") throw {code:"g_slow"};
      if (e?.name === "AbortError" || signal?.aborted) throw {code:"cancelled"};
      throw {code:"blocked"};
    }
    if (!res.ok) {
      let msg = ""; try { const t = await res.text(); msg = (JSON.parse(t)?.error?.message) || (JSON.parse(t)?.[0]?.error?.message) || ""; } catch {}
      if (res.status === 400 && noThink && /think/i.test(msg)) { noThink = false; return geminiOnce(model, prompt, signal); }
      if (res.status === 429) throw {code:"g_rate"};
      if (res.status === 401 || res.status === 403 || (res.status === 400 && /api.?key/i.test(msg))) throw {code:"bad_key"};
      if (res.status === 404) throw {code:"bad_model"};
      if (res.status >= 500) throw {code:"g_busy"};
      throw {code:"g_other", detail:res.status + (msg ? " " + msg.slice(0, 120) : "")};
    }
    // read the server-sent events as they arrive
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "", text = "", blocked = false, finish = "";
    const eat = chunk => {
      for (const line of chunk.split(/\r?\n/)) {
        if (!line.startsWith("data:")) continue;
        let j; try { j = JSON.parse(line.slice(5)); } catch { continue; }
        if (j?.promptFeedback?.blockReason) blocked = true;
        const c = j?.candidates?.[0];
        if (c?.finishReason) finish = c.finishReason;
        for (const part of (c?.content?.parts || [])) if (!part.thought && part.text) text += part.text;
      }
    };
    try {
      for (;;) {
        const {done, value} = await reader.read();
        if (done) break;
        kick();
        buf += dec.decode(value, {stream:true});
        const cut = buf.lastIndexOf("\n\n");
        if (cut >= 0) { eat(buf.slice(0, cut)); buf = buf.slice(cut + 2); got = text.length; }
      }
      eat(buf + dec.decode());
    } catch (e) {
      if (why === "slow") throw {code:"g_slow"};
      if (signal?.aborted) throw {code:"cancelled"};
      throw {code:"g_busy"};
    }
    if (!text.trim()) throw {code: blocked || finish === "SAFETY" ? "refused" : "empty_completion"};
    if (finish === "MAX_TOKENS") { try { return parseLoose(text); } catch { throw {code:"g_long"}; } }
    return parseLoose(text);
  } finally {
    clearTimeout(idle); clearInterval(tick); signal?.removeEventListener("abort", onAbort);
  }
}

(() => {

  if (pref.notes === false) $("#notesBtn").setAttribute("aria-pressed", "false");
  if (["claude","fast","gemini","manual"].includes(pref.engine)) engine = pref.engine;
  if (!window.claude && (engine === "claude" || engine === "fast")) engine = "gemini";
  const g = store.get("cr-gemini"); if (g && typeof g === "object") gem = {key:String(g.key || ""), model:String(g.model || "gemini-flash-latest")};
  $("#aiLbl").textContent = ENG_LBL[engine];
  let curTheme = pref.theme || "system";
  applyTheme(curTheme);
  $("#themeBtn").addEventListener("click", () => {
    const order = ["system", "light", "dark"];
    const next = curTheme = order[(order.indexOf(curTheme) + 1) % 3];
    store.set("cr-pref", {...(store.get("cr-pref") || {}), theme:next}); applyTheme(next);
  });
  const last = store.get("cr-doc");
  if (last && Array.isArray(last.cells) && last.cells.length) { try { loadDoc(last.name, last.cells); } catch { loadSample(); } }
  else loadSample();
  if (doc.sample) openLine(2, 7, false);
  const use = window.claude && window.claude.use;
  if (!use) { sampleReady = true; updateAiUi(); return; }
  Promise.all([window.claude.use("db"), window.claude.use("user")].map(p => Promise.resolve(p).catch(() => null))).then(async ([d, u]) => {
    if (!d || !u) return;
    let id = null; try { id = await u.id(); } catch {}
    if (!id) return;
    dbApi = d; uid = id; renderNotice(); pullRemote();
  });
  Promise.resolve(window.claude.use("sample")).catch(() => null).then(s => {
    sampleFn = s || null; sampleReady = true;
    updateAiUi();
  });
})();
</script>
<script>
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
